# Fork builds with the mihomo core: Android APKs and a Windows portable zip as artifacts.
name: Build (mihomo)

on:
  push:
    branches: [mihomo, mihomo-next]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The mihomo core AARs come prebuilt with pinned SHA-256 (see androidApp/build.gradle.kts).
      - name: Unit tests
        run: ./gradlew :shared:jvmTest --console=plain
      - name: Android release build
        run: ./gradlew :androidApp:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ghostly-android
          path: |
            androidApp/build/outputs/apk/release/*arm64*.apk
            androidApp/build/outputs/apk/release/*universal*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop app image
        run: ./gradlew :desktopApp:createDistributable --console=plain
      - name: Portable zip
        shell: pwsh
        run: |
          $app = "desktopApp\build\compose\binaries\main\app\Ghostly"
          Set-Content -Path "$app\portable" -Value "Ghostly portable (mihomo)" -Encoding ascii
          New-Item -ItemType Directory -Force build\release | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -a -c -f build\release\Ghostly-Windows-Portable.zip -C desktopApp\build\compose\binaries\main\app Ghostly
      - uses: actions/upload-artifact@v4
        with:
          name: ghostly-windows-portable
          path: build/release/Ghostly-Windows-Portable.zip
